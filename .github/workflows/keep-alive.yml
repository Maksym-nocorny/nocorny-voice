name: Keep Render alive

on:
  schedule:
    # Render free tier sleeps after 15 min of inactivity. */14 keeps a 1-min
    # buffer while reducing scheduled-run pressure on free GitHub runners
    # (more frequent crons get auto-cancelled when the queue is busy).
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render
        run: |
          curl -sS --max-time 60 -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            https://nocorny-voice.onrender.com/ || true
