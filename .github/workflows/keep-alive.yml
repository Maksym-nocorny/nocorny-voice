name: Keep Render alive

on:
  schedule:
    # Render free tier sleeps after 15 min of inactivity. */10 gives 5-min
    # buffer against GitHub Actions schedule delays.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping Render
        run: |
          curl -sS --max-time 30 -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            https://nocorny-voice.onrender.com/
